<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#21302b">
    <title>Bağlantı Yok | Otel Güvenlik Sistemi</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f5ef;
        --ink: #18211f;
        --muted: #66706d;
        --brand: #0f766e;
        --shell: #21302b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: var(--bg);
        color: var(--ink);
        display: grid;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 18px;
      }

      main {
        background: #fff;
        border: 1px solid #d9ded5;
        border-radius: 8px;
        box-shadow: 0 18px 42px rgba(25, 33, 31, 0.12);
        display: grid;
        gap: 12px;
        margin: 0 auto;
        max-width: 460px;
        padding: 22px;
      }

      .logo {
        background: var(--shell);
        border-radius: 8px;
        color: #fff;
        display: grid;
        font-weight: 900;
        height: 54px;
        place-items: center;
        width: 54px;
      }

      h1 {
        font-size: 1.45rem;
        margin: 0;
      }

      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0;
      }

      a {
        background: var(--brand);
        border-radius: 6px;
        color: #fff;
        display: inline-flex;
        font-weight: 800;
        justify-content: center;
        margin-top: 4px;
        padding: 11px 14px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="logo">OG</span>
      <h1>Bağlantı yok</h1>
      <p>Paneli kullanmak için internet veya yerel ağ bağlantısı gerekiyor. Bağlantı geldiğinde tekrar deneyin.</p>
      <a href="/">Tekrar dene</a>
    </main>
  </body>
</html>
